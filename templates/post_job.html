{% extends 'base.html' %}
{% block title %}Post a Job{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-5">
                    <h3 class="fw-bold mb-1"><i class="bi bi-plus-circle text-primary"></i> Post a New Job</h3>
                    <p class="text-muted mb-4">Fill in the details to attract the best candidates</p>

                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Job Title *</label>
                                <input type="text" name="title" class="form-control" placeholder="e.g. Python Developer" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Company Name *</label>
                                <input type="text" name="company" class="form-control" placeholder="Your company name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" name="location" class="form-control" placeholder="e.g. Hyderabad / Remote">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Salary (per month)</label>
                                <input type="text" name="salary" class="form-control" placeholder="e.g. 25,000 - 40,000">
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-bold">Category</label>
                                <select id="category" name="category" class="form-select">
                                    <option value="">Select Category</option>
                                    {% for cat in ['Technology', 'Marketing', 'Design', 'Finance', 'Healthcare', 'Education', 'Recruitment', 'Other'] %}
                                        <option value="{{ cat }}">{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Job Description *</label>
                                <textarea name="description" class="form-control" rows="6"
                                    placeholder="Describe the role, responsibilities, and requirements..." required></textarea>
                            </div>
                            <div class="col-12 d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="{{ url_for('employer_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary fw-bold px-5">
                                    <i class="bi bi-send"></i> Post Job
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
