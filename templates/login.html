{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-briefcase-fill text-primary fs-1"></i>
                        <h3 class="fw-bold mt-2">Welcome Back!</h3>
                        <p class="text-muted">Login to your Work4U account</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control form-control-lg" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </form>
                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold">Register here</a>
                    </p>
                    <p class="text-center text-muted small mt-2">
                        Admin: admin@work4u.com / admin123
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
